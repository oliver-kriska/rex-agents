name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          cache: true
      - name: Lint, unit, setup and formula checks
        run: make check
      # Rex is distributed separately. No unattended, version-pinned installer is configured;
      # run tests/e2e.sh locally on preview.18 and preview.20 before releasing.
      - name: Audit in a disposable CI tap
        run: |
          brew tap-new --no-git rex-agents/ci-test
          trap 'brew untap rex-agents/ci-test' EXIT
          cp Formula/rex-agents.rb "$(brew --repository rex-agents/ci-test)/Formula/rex-agents.rb"
          brew audit --strict --formula rex-agents/ci-test/rex-agents
          # This checks metadata, not tarball availability or the release checksum.
          # RELEASING.md requires a real source install after replacing the placeholder.
